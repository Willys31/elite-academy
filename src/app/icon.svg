<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Elite Academy" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Encre : le fond des surfaces sombres du site. -->
  <rect width="64" height="64" rx="14" fill="#080b1f"/>
  <!-- Liseré or, écho du double filet des certificats. -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="10.5" fill="none" stroke="#e5b954" stroke-opacity="0.55" stroke-width="1.5"/>
  <!-- Monogramme : dessiné en formes pleines plutôt qu'en texte, pour que
       l'icône ne dépende d'aucune police installée sur la machine. -->
  <g fill="#e5b954">
    <!-- E -->
    <rect x="15" y="20" width="5" height="24" rx="1.4"/>
    <rect x="15" y="20" width="15" height="5" rx="1.4"/>
    <rect x="15" y="29.5" width="12" height="4.6" rx="1.4"/>
    <rect x="15" y="39" width="15" height="5" rx="1.4"/>
    <!-- A -->
    <path d="M42.6 20h4.6l7.4 24h-5.3l-1.5-5.4h-8.3L38 44h-5.3l7.4-24zm2.3 6.6-2.9 10.2h5.8L44.9 26.6z"/>
  </g>
</svg>
